<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ClimSmart-Rice</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:13px "Helvetica Neue",Arial,sans-serif;background:#f3f3f3;color:#333}
header{height:44px;background:#1f4d1b;color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px}header img{height:32px;background:#fff;border-radius:3px;padding:1px}header h1{font-size:16px;margin:0;font-weight:600}.sp{flex:1}
.btn{border:1px solid #b9d9a2;background:transparent;color:#fff;padding:6px 14px;border-radius:3px;cursor:pointer;font:600 13px Arial}.dep{background:#6fb33a;border-color:#6fb33a}.dep:hover{background:#82c94a}
.main{flex:1;display:flex;min-height:0}#pal{width:150px;background:#f9f9f9;border-right:1px solid #ccc;overflow:auto}.cat{background:#e3ebdc;padding:5px 8px;font-weight:600;border-bottom:1px solid #ccc}
.chip{margin:5px 8px;height:26px;border:1px solid #0004;border-radius:4px;display:flex;align-items:center;font-size:11px;overflow:hidden}.chip b,.ic{width:26px;height:100%;background:#0002;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}.chip span{padding-left:6px}
#mid{flex:1;display:flex;flex-direction:column;min-width:0}.tabs{background:#e8ecE5;border-bottom:1px solid #bbb;display:flex;align-items:flex-end;padding:6px 8px 0;gap:6px}.tabs .on{background:#fff;border:1px solid #bbb;border-bottom:0;padding:5px 14px;border-radius:4px 4px 0 0}.hint{margin-left:auto;color:#777;font-size:11px;padding-bottom:5px}
#ws{flex:1;overflow:auto;background:#fff;background-image:linear-gradient(#f0f0f0 1px,transparent 1px),linear-gradient(90deg,#f0f0f0 1px,transparent 1px);background-size:20px 20px}
#cv{position:relative;width:1230px;height:300px;transform-origin:0 0}#wr{position:absolute;left:0;top:0;width:1230px;height:300px;overflow:visible;pointer-events:none}
#wr path{fill:none;stroke:#7fa66b;stroke-width:3}#wr.flow path{stroke:#3d8a1f;stroke-dasharray:8 6;animation:d .5s linear infinite}@keyframes d{to{stroke-dashoffset:-14}}
.node{position:absolute;width:104px;height:30px;border:1px solid #0005;border-radius:5px;display:flex;align-items:center;cursor:pointer;font-size:11px;user-select:none}.node .lb{padding-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:72px}
.node.act{box-shadow:0 0 0 4px #6fb33a88}.node.sel{outline:2px solid #e8731a}.pt{position:absolute;top:10px;width:8px;height:10px;background:#ddd;border:1px solid #888;border-radius:2px}.pt.l{left:-5px}.pt.r{right:-5px}
.st{position:absolute;top:33px;left:2px;font-size:10px;color:#666;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
#side{width:320px;background:#fff;border-left:1px solid #ccc;display:flex;flex-direction:column}#side .tabs span{cursor:pointer;padding:5px 12px}#dbg{flex:1;overflow:auto}.m{padding:6px 8px;border-bottom:1px solid #eee;border-left:4px solid #6fb33a;font-size:12px}.m small{color:#777}
#toast{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:#3d8a1f;color:#fff;padding:8px 20px;border-radius:3px;display:none;z-index:20}
#ov{position:fixed;inset:0;background:#0006;display:none;justify-content:center;align-items:flex-start;padding-top:50px;z-index:9}#dlg{width:780px;max-width:96vw;max-height:85vh;background:#fff;border-radius:4px;display:flex;flex-direction:column;box-shadow:0 8px 30px #0006}
.dh{background:#3d8a1f;color:#fff;padding:9px 14px;font-weight:600}.dt{display:flex;border-bottom:1px solid #ccc;background:#f3f3f3}.dt span{padding:7px 16px;cursor:pointer}.dt .on{background:#fff;border-bottom:2px solid #3d8a1f;font-weight:600}#db{padding:12px;overflow:auto;flex:1}.df{padding:10px;text-align:right;border-top:1px solid #ddd;background:#f3f3f3}
.b2{padding:6px 16px;border:1px solid #999;background:#fff;border-radius:3px;margin-left:6px;cursor:pointer}.b2.ok{background:#3d8a1f;border-color:#3d8a1f;color:#fff}.row{display:flex;margin:6px 0}.row label{width:130px;color:#555;padding-top:5px}.inp{flex:1;border:1px solid #bbb;background:#fafafa;padding:5px 8px;border-radius:3px}
h3{margin:0 0 8px;padding:3px 6px;background:#e8f1e3;border:1px solid #b8d4a8}table{border-collapse:collapse;margin:6px 0}td,th{border:1px solid #ccc;padding:2px 8px}th{background:#eef4ea;text-align:left}select{padding:1px 6px}
.b{padding:1px 6px;color:#fff;border-radius:2px}.LOW{background:#4a8626}.MODERATE{background:#e0a010}.HIGH{background:#c0392b}.strip{display:flex;gap:2px;flex-wrap:wrap}.strip div{width:34px;height:40px;color:#fff;font-size:10px;text-align:center;padding-top:4px}canvas{border:1px solid #bbb;max-width:100%}
</style></head><body>

met(){return'<pre style="background:#f6f6f6;padding:8px;overflow:auto">'+['[weather.met.weather]','latitude = '+cen()[1].toFixed(4),'longitude = '+cen()[0].toFixed(4),'year day radn maxt mint rain','() () (MJ/m2) (oC) (oC) (mm)',...D.w.slice(0,12).map(w=>{const d=new Date(w.date);return[d.getUTCFullYear(),Math.floor((d-Date.UTC(d.getUTCFullYear(),0,0))/864e5),w.radn,w.maxt,w.mint,w.rain].join(' ')})].join('\n')+'</pre>'},
out(){if(!D.out)return'No APSIM output yet.';const t=Object.keys(D.out);setTimeout(()=>ot(t[0]));return`<h3>Table <select id=ts onchange="ot(this.value)">${t.map(x=>`<option>${x}</option>`)}</select> Column <select id=cs onchange="oc()"></select></h3><canvas id=c3 width=720 height=210></canvas><div id=og></div>`},
adv(){const a=D.adv;if(!a)return'Run pipeline first.';return'<h3>Fertiliser N timing</h3><table><tr>'+['Stage','kg N/ha','Target','Best day','Rain 48h','Rain 72h','Risk','Action'].map(x=>`<th>${x}</th>`).join('')+'</tr>'+a.plan.map(p=>`<tr><td>${p.stage}</td><td>${p.kg_n}</td><td>${p.target}</td><td>${p.best} <small>(${p.status})</small></td><td>${p.rain48}</td><td>${p.rain72}</td><td><span class="b ${p.risk}">${p.risk}</span></td><td>${p.action}</td></tr>`).join('')+'</table><h3>Daily leaching / runoff risk</h3><div class=strip>'+a.daily.map(d=>`<div class=${d.risk} title="${d.rain} mm">${d.date.slice(5)}<br>${d.rain.toFixed(0)}</div>`).join('')+'</div>'}};
let oc_;function ot(n){oc_=D.out[n];const num=oc_.columns.filter((c,i)=>typeof oc_.rows.find(r=>r[i]!=null)?.[i]=='number');$('#cs').innerHTML=num.map(x=>`<option>${x}</option>`);oc();$('#og').innerHTML=grid(oc_.columns,oc_.rows.slice(-12))}

function mk(n){const e=document.createElement('div');e.className='node';e.id='n_'+n[0];e.style.cssText=`left:${n[2]}px;top:${n[3]}px;background:${n[4]}`;e.innerHTML=`<span class=ic>${n[5]}</span><span class=lb>${n[1]}</span><i class="pt l"></i><i class="pt r"></i><div class=st></div>`;
e.onmousedown=ev=>{const sx=ev.clientX,sy=ev.clientY,ox=n[2],oy=n[3];let mv=0;const m=v=>{const dx=(v.clientX-sx)/S,dy=(v.clientY-sy)/S;if(Math.abs(dx)+Math.abs(dy)>3)mv=1;if(mv){n[2]=Math.max(0,ox+dx);n[3]=Math.max(0,oy+dy);e.style.left=n[2]+'px';e.style.top=n[3]+'px';wires()}},u=()=>{removeEventListener('mousemove',m);removeEventListener('mouseup',u);if(!mv)edit(n[0])};addEventListener('mousemove',m);addEventListener('mouseup',u)};$('#cv').appendChild(e)}
